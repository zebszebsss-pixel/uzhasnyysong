<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ужасныйsong — музыка</title>
<meta name="description" content="Ужасныйsong — найди любую песню, собирай плейлисты, веди свой профиль.">
<meta name="apple-mobile-web-app-title" content="Ужасныйsong">
<meta name="application-name" content="Ужасныйsong">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0b">
<meta property="og:title" content="Ужасныйsong">
<meta property="og:description" content="Твоя музыка. Твой вайб.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: тихая готика — мрамор, дым, ангелы; спокойно и дорого
   IDEA: альбом в чёрном бархате с мраморными статуями
   PICTURE: баннер-обложка профиля и дымчатый hero, обложки треков
   COLOUR/TYPE: чёрный и графит, молочно-белый, пепел, редкий красный #c8102e; Cormorant Garamond + Manrope
   LAYOUT: одна колонка, нижняя панель вкладок, мини-плеер над ней */
:root{--bg:#0a0a0b;--g1:#131315;--g2:#1c1c1f;--glass:rgba(26,26,29,.66);--milk:#f3eee7;--ash:#9a958f;--ash2:#5f5b57;--line:rgba(243,238,231,.09);--red:#c8102e;--redg:0 0 16px rgba(200,16,46,.55);
--smoke:radial-gradient(60% 55% at 75% 25%,rgba(214,208,200,.38),transparent 70%),radial-gradient(45% 50% at 20% 70%,rgba(170,164,158,.26),transparent 70%),radial-gradient(35% 40% at 50% 45%,rgba(240,235,228,.18),transparent 70%),linear-gradient(160deg,#2a2826,#121112 70%)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--milk);font:16px/1.5 Manrope,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(170px + env(safe-area-inset-bottom));overflow-x:clip}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 40% at 85% 0,rgba(160,155,150,.16),transparent 70%),radial-gradient(50% 35% at 0 45%,rgba(120,116,112,.12),transparent 70%),radial-gradient(70% 40% at 60% 100%,rgba(110,106,102,.1),transparent 70%)}
button{font:500 15px Manrope,sans-serif;border:0;border-radius:14px;cursor:pointer;min-height:44px;color:var(--milk);background:var(--g2)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
svg{display:block;flex:none}
.wrap{max-width:720px;margin:auto;padding:0 18px}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.logo{font:italic 600 32px/1 'Cormorant Garamond',Georgia,serif;margin:0;letter-spacing:-.01em}
.logo i{color:var(--red)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 10px}
.ib{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);position:relative;backdrop-filter:blur(12px)}
.bdg{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:600 11px/17px Manrope,sans-serif;padding:0 4px;display:none}
h2{font:600 26px/1.15 'Cormorant Garamond',Georgia,serif;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
h2 button{min-height:32px;background:none;color:var(--red);font-size:14px;padding:0}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(14px)}
.view{display:none}.view.on{display:block;animation:vin .3s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}
input,textarea{width:100%;font:16px Manrope,sans-serif;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:var(--g1);color:var(--milk)}
input:focus,textarea:focus{border-color:rgba(200,16,46,.7);outline:none}
textarea{min-height:96px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--ash);margin:14px 0 6px}
.pri{background:var(--red);color:#fff;padding:0 20px;box-shadow:var(--redg)}
.milk{background:var(--milk);color:#111;padding:0 18px}
.gb{background:var(--glass);border:1px solid var(--line);padding:0 16px}
.note{font-size:13px;color:var(--ash)}
.empty{color:var(--ash);text-align:center;padding:34px 12px}
.warn{display:none;border:1px solid rgba(200,16,46,.6);background:rgba(200,16,46,.1);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px}

/* главная */
.hero{position:relative;min-height:250px;border-radius:24px;overflow:hidden;background:var(--smoke);background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;border:1px solid var(--line)}
.hero::after{content:'';position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,transparent 30%,rgba(10,10,11,.85))}
.hero>*{position:relative;z-index:1}
.hero>.md{position:absolute;z-index:0}
.md{position:absolute;inset:0;overflow:hidden;z-index:0;border-radius:inherit}
.md img,.md video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero h1{font:500 48px/1 'Cormorant Garamond',Georgia,serif;margin:0}
.hero p{margin:6px 0 16px;color:var(--ash)}
.bigplay{width:60px;height:60px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--red);color:#fff;box-shadow:var(--redg)}
.spill{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:0 16px;min-height:50px;border-radius:25px;background:var(--glass);border:1px solid var(--line);color:var(--ash);text-align:left;font-weight:400}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hc{flex:none;width:132px;scroll-snap-align:start;background:none;padding:0;text-align:left;display:block;height:auto;font-weight:400}
.hc .im{position:relative;width:132px;height:132px;border-radius:16px;overflow:hidden;background:var(--g2) center/cover}
.hc .im img{width:100%;height:100%;object-fit:cover;display:block}
.hc .pi{position:absolute;left:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:rgba(10,10,11,.7);display:grid;place-items:center;border:1px solid rgba(243,238,231,.4)}
.hc b{display:block;font:500 14px/1.3 Manrope,sans-serif;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hc small{color:var(--ash)}
.ph{display:grid;place-items:center;background:var(--smoke);color:var(--milk);font:italic 600 34px 'Cormorant Garamond',Georgia,serif}
.mkc .im{display:grid;place-items:center;border:1px dashed rgba(200,16,46,.6);background:var(--g1);color:var(--red)}

/* поиск и лента */
form.sf{display:flex;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chips button{min-height:34px;padding:0 14px;background:var(--glass);color:var(--ash);border:1px solid var(--line);font-size:14px;border-radius:17px}
.status{color:var(--ash);margin:6px 0 10px;font-size:14px}
.status.load::after{content:'';display:inline-block;width:8px;height:8px;margin-left:8px;border-radius:50%;background:var(--red);animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.2}}
.arts{display:flex;gap:12px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.arts button{flex:none;width:84px;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ash);padding:0;height:auto}
.arts img{width:70px;height:70px;border-radius:50%;object-fit:cover;background:var(--g2)}
.ahero{display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;align-items:center;padding:16px;margin:6px 0}
.ahero img{width:104px;height:104px;border-radius:50%;object-fit:cover;border:2px solid var(--milk)}
.ahero h3{font:600 clamp(26px,7vw,36px)/1.05 'Cormorant Garamond',Georgia,serif;margin:0 0 4px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row button{min-height:40px;padding:0 14px;font-size:14px}
.flow{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;perspective:1000px;padding:20px calc(50% - 80px) 56px;margin:0 -18px;scrollbar-width:none;animation:tunnel .6s cubic-bezier(.2,.8,.2,1)}
.flow::-webkit-scrollbar{display:none}
@keyframes tunnel{from{opacity:0;transform:perspective(800px) rotateX(35deg) translateZ(-120px)}}
.fc{flex:none;width:160px;scroll-snap-align:center;transform-style:preserve-3d;transition:transform .12s linear,opacity .12s;text-align:center}
.fcb{display:block;width:160px;height:160px;padding:0;border-radius:16px;background:var(--g2)}
.fcb img{width:160px;height:160px;border-radius:16px;object-fit:cover;display:block;-webkit-box-reflect:below 6px linear-gradient(transparent 65%,rgba(0,0,0,.3))}
.fc .name{margin-top:10px;font-size:14px}
.fc .row{justify-content:center;margin-top:4px}
.fc.on .fcb img{outline:2px solid var(--red)}
.gridT{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;perspective:1000px}
.g{position:relative;animation:fly .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes fly{from{opacity:0;transform:rotateX(-55deg) translateY(30px)}}
.gc{position:relative;display:block;width:100%;padding:0;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--g2);height:auto}
.gc img{width:100%;height:100%;object-fit:cover;display:block}
.g.on .gc{outline:2px solid var(--red)}
.g .gi{padding:8px 0 0}
.g .row{margin-top:4px}
.sm{min-height:36px!important;width:36px;padding:0!important;display:grid;place-items:center;border-radius:50%!important;background:var(--glass);border:1px solid var(--line)}
.hb.on{color:var(--red)}
.name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art{color:var(--ash);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* строки треков */
.list{display:grid;gap:8px}
.t{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.t.on{border-color:rgba(200,16,46,.7)}
.cover{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--g2);display:grid;place-items:center;color:var(--ash)}
.acts{display:flex;gap:4px;align-items:center}
.acts button{width:38px;min-height:38px;padding:0;display:grid;place-items:center;background:none;color:var(--ash)}
.acts .play{border-radius:50%;border:1px solid rgba(243,238,231,.35);color:var(--milk)}
.t.on .play{background:var(--red);border-color:var(--red);color:#fff}

/* библиотека */
.mk{display:flex;align-items:center;gap:16px;width:100%;min-height:96px;padding:0 22px;border-radius:20px;background:var(--smoke);border:1px solid var(--line);font:600 22px 'Cormorant Garamond',Georgia,serif;text-align:left;margin-bottom:12px}
.mk span{color:var(--red);font-size:30px;font-family:Manrope,sans-serif;font-weight:300}
.lr{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lr .lc{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--g2);padding:0;overflow:hidden;display:grid;place-items:center}
.lr .lc img{width:100%;height:100%;object-fit:cover}
.lr .ln{background:none;text-align:left;padding:0;display:block;height:auto}
.lr .ln b{display:block;font:600 20px 'Cormorant Garamond',Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .ln small{color:var(--ash)}
.ring{width:40px;min-height:40px;border-radius:50%;padding:0;display:grid;place-items:center;background:none;border:1px solid rgba(243,238,231,.4)}
.dots{width:32px;background:none;color:var(--ash);padding:0;font-size:20px}
.favc{background:linear-gradient(135deg,#3a0a12,#141416);color:var(--red)}

/* профиль */
.ban{position:relative;overflow:hidden;aspect-ratio:16/9;max-height:320px;margin:0 -18px;background:var(--smoke);background-size:cover;background-position:center}
.ban::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(10,10,11,.15),rgba(10,10,11,0) 40%,var(--bg))}
.ban .ib{position:absolute;top:14px;right:18px;z-index:2}
.phead{display:flex;gap:16px;align-items:flex-end;margin-top:-64px;position:relative;z-index:1}
.pav{position:relative;overflow:hidden;width:112px;height:112px;border-radius:50%;flex:none;border:3px solid var(--milk);box-shadow:0 0 0 3px rgba(200,16,46,.45),var(--redg);background:var(--g2) center/cover;display:grid;place-items:center;font:italic 600 44px 'Cormorant Garamond',Georgia,serif}
.pname{font:600 clamp(30px,8vw,40px)/1.05 'Cormorant Garamond',Georgia,serif;margin:0;word-break:break-word}
.uname{color:var(--ash);font-size:15px}
.bio{margin:12px 0 0;color:var(--milk);opacity:.9;white-space:pre-line}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.pbtns button{font-size:14px;padding:0 10px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{padding:12px 4px;text-align:center;border-radius:16px}
.stat b{display:block;font:600 28px/1.1 'Cormorant Garamond',Georgia,serif}
.stat span{font-size:12px;color:var(--ash)}
.menu{margin-top:16px;overflow:hidden;padding:0}
.menu button{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;border-radius:0;background:none;min-height:56px;padding:0 16px;text-align:left;font:600 19px 'Cormorant Garamond',Georgia,serif;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu .cnt{color:var(--ash);font:13px Manrope,sans-serif;display:flex;align-items:center;gap:6px}
.menu .rb{background:var(--red);color:#fff;border-radius:9px;padding:0 7px;font:600 12px/18px Manrope,sans-serif}

/* вложенные страницы */
.subh{display:flex;align-items:center;gap:12px;padding:16px 0 6px}
.subh h3{font:600 28px/1.15 'Cormorant Garamond',Georgia,serif;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plh{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:center;margin:8px 0 14px}
.plh .lc{width:110px;height:110px;border-radius:16px;overflow:hidden;background:var(--g2)}
.plh .lc img{width:100%;height:100%;object-fit:cover}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px}
.agrid button{background:none;display:flex;flex-direction:column;align-items:center;gap:8px;height:auto;padding:0;font-size:14px}
.agrid img{width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--g2)}
.nt{display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.nt i{width:8px;height:8px;border-radius:50%;margin-top:8px;background:var(--ash2)}
.nt.unread i{background:var(--red);box-shadow:var(--redg)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw input{width:48px;height:28px;appearance:none;-webkit-appearance:none;background:var(--ash2);border-radius:14px;position:relative;padding:0;border:0;flex:none;cursor:pointer}
.sw input::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--milk);transition:transform .2s}
.sw input:checked{background:var(--red)}
.sw input:checked::after{transform:translateX(20px)}
details{border-bottom:1px solid var(--line);padding:12px 2px}
summary{cursor:pointer;font:600 18px 'Cormorant Garamond',Georgia,serif}
details p{color:var(--ash);margin:8px 0 0;font-size:14px}
.ebn{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--smoke);background-size:cover;background-position:center;border:1px solid var(--line)}
.eav{position:relative;overflow:hidden;margin:-48px 0 0 16px;width:96px;height:96px;border-radius:50%;border:3px solid var(--milk);background:var(--g2) center/cover;display:grid;place-items:center;font:italic 600 38px 'Cormorant Garamond',Georgia,serif}
.erow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.erow button{min-height:38px;padding:0 14px;font-size:14px}
.umsg{font-size:13px;margin-top:6px;min-height:18px}
.ok{color:#7fd19b}.bad{color:#ff6b6b}

/* панель, плеер */
.tabs{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:6;display:grid;grid-template-columns:repeat(5,1fr);max-width:700px;margin:auto;border-radius:26px;padding:6px;background:rgba(20,20,22,.88);border:1px solid var(--line);backdrop-filter:blur(16px)}
.tabs button{background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;white-space:nowrap;color:var(--ash);min-height:54px;padding:0}
.tabs button.on{color:var(--red)}
.mini{position:fixed;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:5;max-width:700px;margin:auto;display:none;border-radius:18px;padding:8px 10px;background:rgba(26,26,29,.92);border:1px solid var(--line);backdrop-filter:blur(16px);overflow:hidden}
.mini.show{display:block;animation:up .3s ease}
[hidden]{display:none!important}
.ytbox{position:relative;width:100%;aspect-ratio:16/9;min-height:200px;border-radius:12px;overflow:hidden;background:#000;margin:6px 0 8px}
.ytbox iframe,.ytbox>div{position:absolute;inset:0;width:100%!important;height:100%!important;border:0}
body.yton{padding-bottom:calc(400px + env(safe-area-inset-bottom))}
.vibe{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.vibe::-webkit-scrollbar{display:none}
.vc{flex:none;width:140px;scroll-snap-align:start}
.vc .im{position:relative;display:block;width:140px;height:140px;padding:0;border-radius:16px;overflow:hidden;background:var(--g2)}
.vc .im img{width:100%;height:100%;object-fit:cover;display:block}
.vc .im .pi{position:absolute;left:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:rgba(10,10,11,.7);display:grid;place-items:center;border:1px solid rgba(243,238,231,.4)}
.vc.on .im{outline:2px solid var(--red)}
.vc b{display:block;font-weight:600;font-size:14px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc small{display:block;color:var(--ash);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vadd{width:100%;min-height:36px;margin-top:8px;font-size:13px;font-weight:600;border-radius:18px;background:rgba(200,16,46,.14);color:var(--milk);border:1px solid rgba(200,16,46,.55)}
.vibebox{margin:4px 0 18px;padding:14px 0 4px;border-top:1px solid var(--line)}
.vibebox h2{margin-top:6px}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.mrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.mrow img{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--g2)}
.mctl{display:flex;gap:2px}
.mctl button{width:40px;min-height:40px;padding:0;display:grid;place-items:center;background:none}
.prog{position:absolute;left:0;right:0;top:0;height:3px;background:var(--line);cursor:pointer}
.prog i{display:block;height:100%;width:0;background:var(--red)}

.sh{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sh.show{display:flex}
.shc{background:var(--g1);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:560px;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto;animation:up .25s ease}
.shc h4{font:600 24px 'Cormorant Garamond',Georgia,serif;margin:0 0 14px}
.opt{width:100%;text-align:left;padding:0 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--milk);color:#111;padding:10px 16px;border-radius:14px;font-weight:600;display:none;z-index:40;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.5)}

.crop{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
.crop.show{display:flex}
.cf{position:relative;overflow:hidden;touch-action:none;cursor:grab;background:#111;border-radius:16px}
.cf.round{border-radius:50%}
.cf img,.cf video{position:absolute;left:0;top:0;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.cf:empty::after{content:'Загрузка…';position:absolute;inset:0;display:grid;place-items:center;color:var(--ash)}
.crop input[type=range]{width:min(420px,90vw);accent-color:var(--red);padding:0;border:0;background:none}
.crop .row{justify-content:center}

.login{position:fixed;inset:0;z-index:25;background:var(--bg);overflow:auto;display:none;padding:calc(40px + env(safe-area-inset-top)) 18px 40px}
.login.show{display:block}
.login .lb{max-width:440px;margin:auto}
.login .hero{min-height:200px;margin:20px 0}
.acc{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:8px 12px;text-align:left;margin-bottom:8px;height:auto;background:var(--glass);border:1px solid var(--line)}
.acc .pav{width:48px;height:48px;font-size:20px;border-width:2px;box-shadow:none}
.reduce *{animation:none!important;transition:none!important}
/* ---------- AI Manager ---------- */
.aihead{display:grid;grid-template-columns:128px minmax(0,1fr);gap:14px;align-items:center;padding:10px 14px;margin-top:14px;overflow:visible;background:radial-gradient(120% 90% at 18% 0,rgba(214,208,200,.2),transparent 62%),var(--glass)}
.mgr{position:relative;width:128px}
.mgr svg{width:100%;height:auto;display:block;overflow:visible}
.mgr .hd{transform-box:view-box;transform-origin:400px 640px}
.mgr[data-st=listening] .hd{animation:tilt 1.4s ease-in-out infinite alternate}
.mgr[data-st=talking] .hd{animation:bob .42s ease-in-out infinite alternate}
.mgr[data-st=thinking] .hd{transform:rotate(-3deg)}
.mgr.nod .hd{animation:nod .5s ease}
@keyframes tilt{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes nod{40%{transform:translateY(10px)}}
.mgr .wv{fill:none;stroke:var(--red);stroke-width:5;opacity:0;transform-box:fill-box;transform-origin:center}
.mgr[data-st=listening] .wv{animation:wave 1.2s ease-out infinite}
@keyframes wave{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(2.6)}}
.mgr .dots{position:absolute;top:0;right:-8px;display:none;gap:4px;padding:7px 9px;border-radius:14px;background:var(--milk)}
.mgr[data-st=thinking] .dots{display:flex}
.mgr .dots i,.tdots i{width:6px;height:6px;border-radius:50%;background:#111;animation:pulse .9s infinite alternate}
.tdots{display:inline-flex;gap:4px;padding:4px 0}.tdots i{background:var(--ash)}
.mgr .dots i:nth-child(2),.tdots i:nth-child(2){animation-delay:.2s}.mgr .dots i:nth-child(3),.tdots i:nth-child(3){animation-delay:.4s}
.ainame{margin:0 0 4px;font:600 32px/1 'Cormorant Garamond',Georgia,serif}
.aist{display:flex;align-items:center;gap:6px;color:var(--ash);font-size:14px}
.aist i{width:8px;height:8px;border-radius:50%;background:#3ccf7a;box-shadow:0 0 8px #3ccf7a}
.vbtn{margin-top:10px;min-height:38px;padding:0 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;border-radius:19px}
.vbtn.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:var(--redg)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:14px 0;padding:4px;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.seg button{min-height:38px;background:none;color:var(--ash);font-size:14px;border-radius:12px;padding:0 4px}
.seg button.on{background:var(--milk);color:#111;font-weight:600}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.msg{max-width:84%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.msg.u{align-self:flex-end;background:var(--milk);color:#111;border-bottom-right-radius:6px}
.msg.a{background:var(--glass);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.err{border-color:rgba(200,16,46,.6)}
.msg img.ph{display:block;max-width:200px;border-radius:12px;margin-bottom:6px}
.arow{display:flex;gap:8px;align-items:flex-end;align-self:flex-start;max-width:100%}

.tcards{display:flex;gap:10px;overflow-x:auto;margin:2px 0 0 40px;padding-bottom:4px;scrollbar-width:none}
.tcards::-webkit-scrollbar{display:none}
.tc{flex:none;width:168px;padding:8px;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.tc img{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;display:block;background:var(--g2)}
.tc .name{margin-top:6px}
.tc .why{font-size:12px;color:var(--ash);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tc.on{border-color:var(--red)}
.tc .play{background:var(--red);border-color:var(--red);color:#fff}
.aiin{position:sticky;bottom:calc(84px + var(--minih,0px) + env(safe-area-inset-bottom));z-index:3;padding:10px 0 6px;background:linear-gradient(180deg,transparent,var(--bg) 22%)}
.aibar{display:flex;align-items:flex-end;gap:6px;padding:6px;border-radius:24px;background:rgba(26,26,29,.96);border:1px solid var(--line)}
.aibar textarea{flex:1;min-height:40px;max-height:120px;padding:9px 6px;border:0;background:none;resize:none;font-size:16px}
.aibar .ib{width:40px;height:40px;min-height:40px;flex:none}
.aibar .send{background:var(--red);border:0;color:#fff}
.aibar .rec{background:var(--red);color:#fff;animation:pulse .8s infinite alternate}
.aichips{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.aichips::-webkit-scrollbar{display:none}
.aichips button{flex:none;min-height:34px;padding:0 14px;border-radius:17px;font-size:13px;background:var(--glass);border:1px solid var(--line);color:var(--milk)}
.aichips button.red{border-color:rgba(200,16,46,.65)}
.aiprev{display:flex;gap:8px;align-items:center}
.aiprev img{width:56px;height:56px;border-radius:10px;object-fit:cover;margin-bottom:6px}
.consent{padding:14px;margin-bottom:12px}
.pkf{display:flex;gap:8px}
.pk{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px}
.pknow{width:100%;margin-top:8px;text-align:left;padding:0 14px;font-size:14px}
.pkr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pkr img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--g2)}
.card{padding:16px;margin-top:14px}
.card h3{font:600 22px 'Cormorant Garamond',Georgia,serif;margin:16px 0 6px}
.card p{margin:0}.card ul{margin:0;padding-left:20px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.badges span{padding:4px 10px;border-radius:12px;font-size:13px;background:var(--g2);border:1px solid var(--line)}
.status{padding:10px 12px;border-radius:12px;font-size:13px;border:1px solid rgba(200,16,46,.5);background:rgba(200,16,46,.08)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.chd{padding:8px 6px;border-radius:12px;background:var(--g1);border:1px solid var(--line);text-align:center;color:var(--milk)}
.chd svg{width:100%;height:auto;display:block;margin:4px 0}
.chd .note{font-size:11px}
.sec{margin-bottom:10px}
.chprog{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chprog span{padding:4px 10px;border-radius:10px;background:var(--milk);color:#111;font-weight:600}
.lnk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.lnk a{padding:6px 12px;border-radius:14px;font-size:13px;color:var(--milk);text-decoration:none;border:1px solid var(--line)}
.sing{margin-top:12px}
#singLines{max-height:50vh;overflow:auto;padding:4px 0}
.sl{padding:6px 10px;border-radius:10px;font-size:18px;color:var(--ash);transition:background .2s,color .2s}
.sl .chl{display:block;color:var(--red);font-size:14px;font-weight:700;white-space:pre}
.sl.cur{background:var(--milk);color:#111}
.sctl{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
.sctl button{min-height:40px;padding:0 12px;display:inline-flex;align-items:center}
select{font:15px Manrope,sans-serif;min-height:40px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--g2);color:var(--milk)}

<body>

<script>
{
const APP='Ужасныйsong',VER='5.0';
/* Ключ YouTube Data API для полных песен. Можно вставить сюда или в Настройках приложения. */
const YT_KEY='';
const $=id=>document.getElementById(id);
const au=$('au');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return n+' '+(m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c)};
const ago=ts=>{const m=Math.round((Date.now()-ts)/60000);if(m<1)return'только что';if(m<60)return m+' мин назад';const h=Math.round(m/60);if(h<24)return h+' ч назад';return Math.round(h/24)+' дн назад'};

/* ---------- иконки ---------- */
const IC={home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',lib:'<path d="M5 4v16M10 4v16M15 5l4 15"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
heart:'<path d="M12 20s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z"/>',heartF:'<path fill="currentColor" d="M12 20s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z"/>',
plus:'<path d="M12 5v14M5 12h14"/>',play:'<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',pause:'<path d="M8 5v14M16 5v14" stroke-width="3"/>',
prev:'<path d="M6 5v14M18 5 9 12l9 7z" fill="currentColor"/>',next:'<path d="M18 5v14M6 5l9 7-9 7z" fill="currentColor"/>',bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
down:'<path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/>',up:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7v.5M12 17h.01"/>',
out:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',share:'<path d="M12 3v12M7 8l5-5 5 5M5 13v7h14v-7"/>',back:'<path d="M15 5l-7 7 7 7"/>',
chev:'<path d="m9 5 7 7-7 7"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',hp:'<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="7" rx="1.8"/><rect x="16.5" y="14" width="4.5" height="7" rx="1.8"/>',send:'<path d="M4 12 20 4l-6 16-3-7z"/>',list:'<path d="M4 6h16M4 12h16M4 18h10"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',img:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/>'};
const I=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const fillIcons=(root=document)=>root.querySelectorAll('[data-ic]').forEach(el=>{el.outerHTML=I(el.dataset.ic)});
fillIcons();
$('prev').innerHTML=I('prev',20);$('next').innerHTML=I('next',20);$('pp').innerHTML=I('play',24);$('mFav').innerHTML=I('heart',20);

/* ---------- данные: JSON в localStorage, файлы в IndexedDB ---------- */
let S={profiles:[],active:null,recent:[]};
try{const d=JSON.parse(localStorage.getItem('mikx_v2'));if(d&&Array.isArray(d.profiles))S=Object.assign(S,d)}catch(e){}
const save=()=>{try{localStorage.setItem('mikx_v2',JSON.stringify(S))}catch(e){toast('Не удалось сохранить: память браузера заполнена')}};
const prof=()=>S.profiles.find(p=>p.id===S.active);
function migrate(p){
  p.username=p.username||uniqUser(slug(p.name),p.id);p.bio=p.bio||'';p.playlists=p.playlists||[];p.favorites=p.favorites||[];p.history=p.history||[];
  p.plays=p.plays||0;p.artists=p.artists||[];p.uploads=p.uploads||[];p.notifs=p.notifs||[];p.settings=Object.assign({autoplay:true,reduce:false},p.settings);return p;
}
const idb=(()=>{let dbp;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('mikx',1);r.onupgradeneeded=()=>r.result.createObjectStore('blobs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(mode,fn)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction('blobs',mode),r=fn(t.objectStore('blobs'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
  return{
    get:async k=>{const v=await tx('readonly',s=>s.get(k));return v&&v.buf?new Blob([v.buf],{type:v.type||''}):v},
    set:async(k,v)=>{const val=v instanceof Blob?{buf:await v.arrayBuffer(),type:v.type||''}:v;return tx('readwrite',s=>s.put(val,k))},
    del:k=>tx('readwrite',s=>s.delete(k))};
})();
const urls={};
async function blobUrl(k){if(urls[k])return urls[k];try{const b=await idb.get(k);return b?(urls[k]=URL.createObjectURL(b)):null}catch(e){return null}}
async function setBlob(k,b){if(urls[k]){URL.revokeObjectURL(urls[k]);delete urls[k]}return b?idb.set(k,b):idb.del(k)}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const POS0={p:50,q:50,z:1};
const ou=new WeakMap(),objUrl=b=>{if(!ou.has(b))ou.set(b,URL.createObjectURL(b));return ou.get(b)};
function mediaHtml(kind,p){
  if(!(kind==='av'?p.hasAv:p.hasBn))return'';
  const pos=p[kind+'Pos']||POS0,t=p[kind+'Type']||'image';
  return`<div class="md" data-media="${kind}:${p.id}" data-mt="${t}" data-pos="${pos.p},${pos.q},${pos.z}"></div>`;
}
function mediaEl(url,type,pos){
  const v=type==='video',el=document.createElement(v?'video':'img');
  if(v){el.muted=true;el.defaultMuted=true;el.loop=true;el.autoplay=true;el.playsInline=true;el.setAttribute('playsinline','');el.setAttribute('muted','')}else el.alt='';
  el.style.cssText=`object-position:${pos.p}% ${pos.q}%;transform:scale(${pos.z});transform-origin:${pos.p}% ${pos.q}%`;
  el.src=url;if(v)el.play().catch(()=>{});
  return el;
}
function hydrate(root=document){root.querySelectorAll('[data-media]').forEach(el=>{
  if(el.firstChild)return;const k=el.dataset.media,[p,q,z]=(el.dataset.pos||'50,50,1').split(',').map(Number);
  blobUrl(k).then(u=>{if(u&&!el.firstChild)el.appendChild(mediaEl(u,el.dataset.mt,{p,q,z}))});
})}

/* ---------- JSONP к Deezer и Apple ---------- */
let jn=0,netOk=false;
function jsonp(url){
  return new Promise((res,rej)=>{
    const cb='mikx_'+(++jn),s=document.createElement('script');
    const t=setTimeout(()=>{clean();rej(new Error('timeout'))},9000);
    function clean(){clearTimeout(t);delete window[cb];s.remove()}
    window[cb]=d=>{netOk=true;clean();d&&d.error?rej(d.error):res(d)};
    s.onerror=()=>{clean();rej(new Error('net'))};
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    document.body.appendChild(s);
  });
}
const DZ=p=>jsonp('https://api.deezer.com'+p+(p.includes('?')?'&':'?')+'output=jsonp');
const IT=p=>jsonp('https://itunes.apple.com/'+p);
const mapDz=r=>({id:'dz:'+r.id,name:r.title,artist:r.artist&&r.artist.name,artistId:r.artist&&r.artist.id,album:r.album&&r.album.title,cover:r.album&&(r.album.cover_big||r.album.cover_medium),preview:r.preview,link:r.link});
const mapIt=r=>({id:'it:'+r.trackId,name:r.trackName,artist:r.artistName,album:r.collectionName,cover:(r.artworkUrl100||'').replace('100x100','400x400'),preview:r.previewUrl,link:r.trackViewUrl});
const slim=t=>({id:t.id,name:t.name,artist:t.artist,artistId:t.artistId||null,album:t.album||'',cover:t.cover||'',preview:t.preview||null,link:t.link||''});

/* ---------- транслит ---------- */
const TR={а:'a',б:'b',в:'v',г:'g',ґ:'g',д:'d',е:'e',є:'ye',ё:'yo',ж:'zh',з:'z',и:'i',і:'i',ї:'yi',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
const LONG={и:'ee',і:'ee',у:'oo'};
const DICT={лил:'lil',янг:'young',биг:'big',зе:'the',дэ:'the',фифти:'50',сент:'cent',снуп:'snoop',догг:'dogg',дог:'dogg',викенд:'weeknd',уикенд:'weeknd',уикнд:'weeknd',скотт:'scott',скот:'scott',трэвис:'travis',тревис:'travis',эминем:'eminem',дрейк:'drake',рианна:'rihanna',бибер:'bieber'};
const tr=(w,long)=>[...w].map(c=>(long&&LONG[c])||(TR[c]??c)).join('');
function variants(q){
  q=q.toLowerCase().trim();
  if(!/[а-яёіїєґ]/.test(q))return[q];
  let combos=[''];
  for(const w of q.split(/\s+/)){const opts=[...new Set([DICT[w],tr(w,0),tr(w,1)].filter(Boolean))];combos=combos.flatMap(c=>opts.map(o=>(c?c+' ':'')+o)).slice(0,12)}
  return[q,...combos];
}
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9а-яёіїєґ]/g,'');
function sim(a,b){
  a=norm(a);b=norm(b);if(!a||!b)return 0;if(a===b)return 1;
  const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}
  return 1-m[a.length][b.length]/Math.max(a.length,b.length);
}
const slug=s=>tr(String(s||'').toLowerCase(),0).replace(/[^a-z0-9_.]/g,'').slice(0,20)||'user';
const userOk=u=>/^[a-z0-9_.]{3,20}$/.test(u);
const userFree=(u,selfId)=>!S.profiles.some(p=>p.id!==selfId&&p.username===u);
function uniqUser(base,selfId){base=(base+'___').slice(0,Math.max(3,base.length));let u=base,n=1;while(!userFree(u,selfId))u=base.slice(0,17)+(++n);return u}

/* ---------- общие строки треков ---------- */
const LISTS={};
const isFav=id=>{const p=prof();return!!p&&p.favorites.some(t=>t.id===id)};
const coverEl=(t,cls='cover')=>t.cover?`<img class="${cls}" src="${esc(t.cover)}" alt="" loading="lazy">`:`<div class="${cls}">${I(t.id&&t.id.startsWith('up:')?'up':'music')}</div>`;
function trackRow(t,i,o){
  const f=isFav(t.id);
  return `<div class="t" data-tid="${esc(t.id)}">${coverEl(t)}
  <div><div class="name">${esc(t.name)}</div><div class="art">${esc(o.meta?o.meta[i]:t.artist)}</div></div>
  <div class="acts"><button class="hb${f?' on':''}" data-act="fav" data-i="${i}" aria-label="Любимое">${I(f?'heartF':'heart',20)}</button>
  ${o.rm!=='rm'?`<button data-act="add" data-i="${i}" aria-label="В плейлист">${I('plus',20)}</button>`:''}${o.rm?`<button data-act="${o.rm}" data-i="${i}" aria-label="Убрать">${I(o.rm==='rmup'?'trash':'x',19)}</button>`:''}
  <button class="play" data-act="play" data-i="${i}" aria-label="Играть">${I('play',16)}</button></div></div>`;
}
function listHtml(key,list,o={}){LISTS[key]=list;list.forEach(t=>{if(t.id.startsWith('up:'))blobUrl(t.id)});return list.length?`<div class="list" data-ctx="${key}">${list.map((t,i)=>trackRow(t,i,o)).join('')}</div>`:`<div class="empty">${o.empty||'Пока пусто.'}</div>`}
function toggleFav(t){
  const p=prof();if(!p||!t)return;
  const i=p.favorites.findIndex(x=>x.id===t.id);
  if(i>=0){p.favorites.splice(i,1);toast('Убрано из любимого')}else{p.favorites.unshift(slim(t));toast('Добавлено в любимое')}
  save();refreshFav();
}
function refreshFav(){
  document.querySelectorAll('[data-tid]').forEach(el=>{const f=isFav(el.dataset.tid);el.querySelectorAll('.hb').forEach(b=>{b.classList.toggle('on',f);b.innerHTML=I(f?'heartF':'heart',20)})});
  const t=queue[cur];const f=t&&isFav(t.id);$('mFav').innerHTML=I(f?'heartF':'heart',20);$('mFav').style.color=f?'var(--red)':'';
}

/* ---------- плеер ---------- */
let queue=[],cur=-1;const retried=new Set();
/* тишина 0.1 с: «разблокирует» звук на iPhone, пока трек догружается */
const SILENT=(()=>{const n=800,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))})();
let silentOn=false;
function unlock(){silentOn=true;au.src=SILENT;au.play().catch(()=>{})}
/* ---- YouTube: полные песни ---- */
let mode='audio',ytp=null,ytCur=null,ytTimer=0,ytHint=false;
const ytKey=()=>S.ytKey||YT_KEY;
const fullOn=()=>{const p=prof();return!!ytKey()&&!(p&&p.settings.full===false)};
const isPaused=()=>mode==='yt'?!(ytp&&ytp.getPlayerState&&ytp.getPlayerState()===1):au.paused;
function ytReady(){
  if(window.YT&&YT.Player)return Promise.resolve();
  return new Promise((res,rej)=>{
    const prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{if(prev)prev();res()};
    if(!document.getElementById('ytapi')){const s=document.createElement('script');s.id='ytapi';s.src='https://www.youtube.com/iframe_api';s.onerror=()=>rej(new Error('yt'));document.head.appendChild(s)}
    setTimeout(()=>rej(new Error('yt timeout')),12000);
  });
}
async function ytFind(t){
  S.yt=S.yt||{};if(S.yt[t.id]&&S.yt[t.id].length)return S.yt[t.id];
  const q=encodeURIComponent(t.artist+' - '+t.name+' audio');
  const r=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=3&q=${q}&key=${encodeURIComponent(ytKey())}`);
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const why=d.error&&d.error.errors&&d.error.errors[0]&&d.error.errors[0].reason;throw new Error(why||('http '+r.status))}
  const ids=(d.items||[]).map(x=>x.id&&x.id.videoId).filter(Boolean);
  if(ids.length){S.yt[t.id]=ids;const k=Object.keys(S.yt);if(k.length>600)delete S.yt[k[0]];save()}
  return ids;
}
function ytStop(){mode='audio';clearInterval(ytTimer);try{ytp&&ytp.stopVideo()}catch(e){}$('ytBox').hidden=true;document.body.classList.remove('yton')}
async function playYT(t){
  au.pause();silentOn=false;mode='yt';showMini(t);addHistory(t);
  $('ytBox').hidden=false;document.body.classList.add('yton');markPlaying();
  let ids=[];
  try{ids=await ytFind(t)}catch(e){
    const m=String(e.message);
    toast(/quota/i.test(m)?'Лимит YouTube на сегодня исчерпан, играю превью':/key|invalid|forbidden|403/i.test(m)?'Ключ YouTube не принят, играю превью':'YouTube недоступен, играю превью');
  }
  if(queue[cur]!==t)return;
  if(!ids.length)return ytFallback(t);
  ytCur={t,ids,k:0};ytLoad();
}
async function ytLoad(){
  try{await ytReady()}catch(e){return ytFallback(ytCur.t)}
  const id=ytCur.ids[ytCur.k];
  if(!ytp){ytp=new YT.Player('ytp',{width:'100%',height:'100%',videoId:id,playerVars:{autoplay:1,playsinline:1,rel:0,modestbranding:1},
      events:{onReady:e=>{try{e.target.playVideo()}catch(err){}},onStateChange:ytState,onError:ytErr}})}
  else ytp.loadVideoById(id);
  clearInterval(ytTimer);ytTimer=setInterval(()=>{try{const d=ytp.getDuration(),c=ytp.getCurrentTime();$('pf').style.width=(d?c/d*100:0)+'%'}catch(e){}},500);
  if(!ytHint)setTimeout(()=>{try{if(mode==='yt'&&ytp.getPlayerState()!==1&&ytp.getPlayerState()!==3){ytHint=true;toast('Нажми ▶ на видео, чтобы запустить')}}catch(e){}},3500);
}
function ytState(e){
  if(mode!=='yt')return;
  if(e.data===1)ytHint=true;
  if(e.data===0){const p=prof();if(!p||p.settings.autoplay)playFrom(queue,cur+1)}
  markPlaying();
}
function ytErr(){if(!ytCur)return;ytCur.k++;if(ytCur.k<ytCur.ids.length)ytLoad();else{if(S.yt)delete S.yt[ytCur.t.id];ytFallback(ytCur.t)}}
function ytFallback(t){ytStop();if(queue[cur]!==t)return;if(t.preview)start(t,t.preview);else refreshPlay(t)}

async function playFrom(list,i){
  if(!list||i<0||i>=list.length)return;
  const t=list[i];
  if(queue===list&&i===cur&&mode==='yt'&&ytp){try{ytp.getPlayerState()===1?ytp.pauseVideo():ytp.playVideo()}catch(e){}return}
  if(queue===list&&i===cur&&au.src&&!silentOn&&mode==='audio'){au.paused?au.play().catch(()=>{}):au.pause();return}
  queue=list;cur=i;
  if(fullOn()&&!t.id.startsWith('up:'))return playYT(t);
  if(mode==='yt')ytStop();
  if(t.id.startsWith('up:')){
    if(urls[t.id])return start(t,urls[t.id]);
    unlock();const u=await blobUrl(t.id);if(!u){silentOn=false;toast('Файл не найден');return}
    if(queue[cur]===t)start(t,u);return;
  }
  if(!t.preview){unlock();return refreshPlay(t)}
  start(t,t.preview);
}
let playTok=0;
function badSrc(){if(silentOn)return;const t=queue[cur];if(t&&au.src&&!t.id.startsWith('up:'))refreshPlay(t)}
function start(t,src){
  silentOn=false;au.src=src;const tok=++playTok;
  au.play().catch(err=>{if(err&&err.name==='NotSupportedError'&&tok===playTok)badSrc()});
  setTimeout(()=>{if(tok===playTok&&!silentOn&&(au.readyState<2||!(au.duration>0))&&au.currentTime===0)badSrc()},7000);
  showMini(t);addHistory(t);markPlaying();
}
async function refreshPlay(t){
  if(retried.has(t.id)){toast('Превью недоступно, дальше');return playFrom(queue,cur+1)}
  retried.add(t.id);
  try{
    const [src,n]=t.id.split(':');let url='';
    if(src==='dz'){const r=await DZ('/track/'+n);url=r.preview;if(!t.cover&&r.album)t.cover=r.album.cover_big||r.album.cover_medium}
    else{const r=await IT('lookup?id='+n),x=r.results&&r.results[0];url=x&&x.previewUrl;if(x&&!t.cover)t.cover=(x.artworkUrl100||'').replace('100x100','400x400')}
    if(!url)throw 0;
    t.preview=url;save();if(queue[cur]===t)start(t,url);
  }catch(e){silentOn=false;toast('Превью недоступно, дальше');playFrom(queue,cur+1)}
}
function showMini(t){
  if(t.cover)$('mImg').src=t.cover;else $('mImg').removeAttribute('src');$('mImg').style.visibility=t.cover?'visible':'hidden';
  $('mName').textContent=t.name;$('mArt').textContent=t.artist;$('mini').classList.add('show');refreshFav();

function markPlaying(){
  const pid=queue[cur]&&queue[cur].id,ps=isPaused();
  document.querySelectorAll('[data-tid]').forEach(el=>{
    const on=el.dataset.tid===pid;el.classList.toggle('on',on);

  });

}
function addHistory(t){
  const p=prof();if(!p)return;
  const h=p.history[0];
  if(!(h&&h.t.id===t.id&&Date.now()-h.at<60000)){p.history.unshift({t:slim(t),at:Date.now()});if(p.history.length>100)p.history.length=100}
  p.plays=(p.plays||0)+1;save();
}

au.onended=()=>{if(silentOn)return;if(!(au.duration>0.5)&&au.currentTime<0.5)return badSrc();const p=prof();if(!p||p.settings.autoplay)playFrom(queue,cur+1)};
$('pp').onclick=()=>{if(cur<0)return;if(mode==='yt'&&ytp){try{ytp.getPlayerState()===1?ytp.pauseVideo():ytp.playVideo()}catch(e){}return}au.paused?au.play().catch(()=>{}):au.pause()};

async function search(q){
  q=q.trim();if(!q)return;
  S.recent=[q,...S.recent.filter(x=>x!==q)].slice(0,6);save();showChips();
  status('Ищу «'+q+'»',1);$('artBox').innerHTML='';$('feed').innerHTML='';
  const vs=variants(q);
  const found=await Promise.all(vs.map(v=>DZ('/search/artist?limit=5&q='+encodeURIComponent(v)).catch(()=>({data:[]}))));
  const seen=new Map();
  found.forEach(r=>(r.data||[]).forEach(a=>{const sc=Math.max(...vs.map(v=>sim(a.name,v)));if(!seen.has(a.id)||seen.get(a.id).sc<sc)seen.set(a.id,{...a,sc})}));
  artists=[...seen.values()].sort((x,y)=>(y.sc-x.sc)||(y.nb_fan-x.nb_fan)).slice(0,8);
  if(artists[0]&&artists[0].sc>=0.72)return openArtist(artists[0],q);
  let res=[];
  for(const v of vs){try{const r=await DZ('/search?limit=40&q='+encodeURIComponent(v));res=(r.data||[]).map(mapDz)}catch(e){}if(res.length)break}
  if(!res.length){for(const v of vs){try{const r=await IT('search?media=music&entity=song&limit=40&term='+encodeURIComponent(v));res=(r.results||[]).map(mapIt)}catch(e){}if(res.length)break}}

}

function flowFx(){

function vibeSeeds(pl){

  const cnt=new Map();

async function vibeFor(pl){
  const have=new Set(pl.tracks.map(t=>t.id)),seeds=vibeSeeds(pl);
  const lists=await Promise.all(seeds.map(async s=>{
    let id=s.id;
    if(!id){try{const r=await DZ('/search/artist?limit=1&q='+encodeURIComponent(s.name));id=r.data&&r.data[0]&&r.data[0].id}catch(e){}}
    if(!id)return[];
    try{const r=await DZ('/artist/'+id+'/radio?limit=25');return(r.data||[]).map(mapDz)}catch(e){return[]}
  }));
  let out=[],from=seeds.map(s=>s.name);
  for(let i=0;i<25;i++)lists.forEach(l=>{if(l[i])out.push(l[i])});
  if(!out.length&&pl.name){try{const r=await DZ('/search?limit=25&q='+encodeURIComponent(pl.name));out=(r.data||[]).map(mapDz);from=['название «'+pl.name+'»']}catch(e){}}

  const seen=new Set();

  return{list:out.slice(0,15),from};

/* ---------- обрезка изображений ---------- */
const MB=1048576;
function crop(file,aspect){
  return new Promise(resolve=>{
    if(!file)return resolve(null);
    const nm=file.name||'',isV=/^video\//.test(file.type)||/\.(mp4|mov|m4v|webm)$/i.test(nm),isI=!isV&&(/^image\//.test(file.type)||/\.(jpe?g|png|webp|gif|heic|heif|avif)$/i.test(nm));
    if(!isV&&!isI){toast('Нужна картинка, GIF или видео');return resolve(null)}
    if(isI&&file.size>15*MB){toast('Картинка больше 15 МБ');return resolve(null)}
    if(isV&&file.size>40*MB){toast('Видео больше 40 МБ');return resolve(null)}
    const url=URL.createObjectURL(file),cf=$('cf'),cz=$('cz'),box=$('crop');
    const fw=Math.min(window.innerWidth-40,aspect===1?320:460),fh=Math.round(fw/aspect);
    cf.innerHTML='';cf.style.width=fw+'px';cf.style.height=fh+'px';cf.classList.toggle('round',aspect===1);cz.value=1;
    $('cOk').disabled=true;box.classList.add('show');
    const el=isV?document.createElement('video'):new Image();
    if(isV){el.muted=true;el.loop=true;el.playsInline=true;el.autoplay=true;el.setAttribute('playsinline','');el.setAttribute('muted','')}
    let state=0;
    const finish=res=>{if(state===2)return;state=2;box.classList.remove('show');if(isV)el.pause();cf.innerHTML='';URL.revokeObjectURL(url);resolve(res)};
    const fail=()=>{if(state===2)return;toast('Этот файл не открывается. Попробуй JPG, PNG, GIF или MP4');finish(null)};
    el.onerror=fail;
    const ready=()=>{
      if(state)return;state=1;
      const iw=isV?el.videoWidth:el.naturalWidth,ih=isV?el.videoHeight:el.naturalHeight;
      if(!iw||!ih)return fail();
      const base=Math.max(fw/iw,fh/ih);let z=1,x=0,y=0,drag=null;
      const sc=()=>base*z;
      const clamp=()=>{x=Math.min(0,Math.max(fw-iw*sc(),x));y=Math.min(0,Math.max(fh-ih*sc(),y))};
      const draw=()=>{clamp();el.style.width=iw*sc()+'px';el.style.height=ih*sc()+'px';el.style.transform=`translate(${x}px,${y}px)`};
      x=(fw-iw*sc())/2;y=(fh-ih*sc())/2;draw();el.style.visibility='visible';$('cOk').disabled=false;
      cf.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox:x,oy:y};try{cf.setPointerCapture(e.pointerId)}catch(err){}};
      cf.onpointermove=e=>{if(!drag)return;x=drag.ox+e.clientX-drag.x;y=drag.oy+e.clientY-drag.y;draw()};
      cf.onpointerup=cf.onpointercancel=()=>{drag=null};
      cz.oninput=()=>{const s0=sc(),cx=(fw/2-x)/s0,cy=(fh/2-y)/s0;z=+cz.value;x=fw/2-cx*sc();y=fh/2-cy*sc();draw()};
      $('cOk').onclick=()=>{
        const s=sc(),dw=fw-iw*s,dh=fh-ih*s,r=v=>Math.round(v*10)/10;
        finish({blob:file,type:isV?'video':'image',pos:{p:r(dw<-.5?x/dw*100:50),q:r(dh<-.5?y/dh*100:50),z:Math.round(z*100)/100}});
      };
    };
    $('cNo').onclick=()=>finish(null);
    el.style.visibility='hidden';cf.appendChild(el);
    if(isV){el.onloadedmetadata=ready;el.src=url;el.load();el.play().catch(()=>{})}else{el.onload=ready;el.src=url}
    setTimeout(()=>{if(!state)fail()},15000);
  });
}

function shareProfile(){
  const p=prof(),pub=t=>!t.id.startsWith('up:'),tk=t=>[t.id,t.name,t.artist];
  const d={n:p.name,u:p.username,b:p.bio,f:p.favorites.filter(pub).slice(0,20).map(tk),pl:p.playlists.slice(0,5).map(x=>({n:x.name,t:x.tracks.filter(pub).slice(0,20).map(tk)}))};
  const link=location.href.split('#')[0]+'#p='+b64e(JSON.stringify(d));
  if(!/^https?:/.test(location.protocol))toast('Ссылка заработает, когда приложение будет на сайте');
  copy(link,'Ссылка на профиль скопирована');
}

/* ---------- навигация ---------- */
function showView(id){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===id))}
function go(t){
  TAB=t;SUB=null;draft=null;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  showView({home:'vHome',search:'vSearch',lib:'vLib',profile:'vProfile',ai:'vAI'}[t]);
  if(t!=='ai'&&(voice.on||voice.listening))stopVoice();
  if(t==='ai')renderAI();
  if(t==='home')renderHome();if(t==='lib')renderLib();if(t==='profile')renderProfile();
  if(t==='search')requestAnimationFrame(()=>{flowFx();refreshFav();markPlaying()});
  updBell();window.scrollTo(0,0);
}
function rerender(){if(SUB)renderSub();else if(TAB==='home')renderHome();else if(TAB==='lib')renderLib();else if(TAB==='profile')renderProfile();updBell()}

  const fav=[...top].sort((x,y)=>y[1]-x[1]).slice(0,6).map(x=>x[0]);

async function aiCall(body){
  if(!/^https?:/.test(location.protocol))return{error:'local'};
  try{
    const r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    if(r.status===404||r.status===405)return{error:'noapi'};
    const d=await r.json().catch(()=>({error:'bad'}));
    if(!r.ok||d.error)return{error:d.error||('http'+r.status)};
    return d;
  }catch(e){return{error:'net'}}
}

async function resolveTracks(list){
  const found=[];let missed=0;
  await Promise.all(list.map(async(w,k)=>{
    const artist=String(w&&w.artist||'').trim(),title=String(w&&w.title||'').trim();if(!artist||!title){missed++;return}
    let best=null;
    for(const q of[`artist:"${artist}" track:"${title}"`,`${artist} ${title}`]){
      try{const r=await DZ('/search?limit=8&q='+encodeURIComponent(q));
        for(const x of r.data||[]){const t=mapDz(x),na=norm(artist),ta=norm(t.artist),nt=norm(title),tt=norm(t.name);
          const am=sim(t.artist,artist)>.55||(na&&ta&&(na.includes(ta)||ta.includes(na)));
          const tm=sim(t.name,title)>.6||(nt&&tt&&(tt.includes(nt)||nt.includes(tt)));
          if(am&&tm){best=t;break}}
      }catch(e){}
      if(best)break;
    }
    if(best){best.why=String(w.why||'').slice(0,220);found[k]=best}else missed++;
  }));
  return{found:found.filter(Boolean),missed};
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const voice={on:false,listening:false,rec:null};
function updVoiceBtn(){const b=$('vmBtn');if(b){b.classList.toggle('on',voice.on);b.innerHTML=I('mic',18)+(voice.on?' Голос включён':' Голосовой режим')}
  const d=$('aiDict');if(d)d.classList.toggle('rec',voice.listening)}
function listen(){
  if(!SR){toast('Голосовой ввод не поддерживается этим браузером');voice.on=false;updVoiceBtn();return}
  if(voice.listening){try{voice.rec.stop()}catch(e){}return}
  try{speechSynthesis.cancel()}catch(e){}
  const rec=new SR();voice.rec=rec;rec.lang=/^(uk|en)/.test(navigator.language||'')?navigator.language:'ru-RU';rec.interimResults=true;rec.continuous=false;
  let fin='';
  rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;fin=t;const ta=$('aiTxt');if(ta)ta.value=t};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){toast('Разреши доступ к микрофону');voice.on=false}};
  rec.onend=()=>{voice.listening=false;if(M.st==='listening')mgrState('idle');updVoiceBtn();if(fin.trim()){const ta=$('aiTxt');if(ta)ta.value='';aiSend(fin)}};
  try{rec.start();voice.listening=true;mgrState('listening');updVoiceBtn()}catch(e){toast('Нажми на микрофон, чтобы говорить')}
}
function stopVoice(){voice.on=false;if(voice.listening){try{voice.rec.abort()}catch(e){}}voice.listening=false;try{speechSynthesis.cancel()}catch(e){}updVoiceBtn()}
function speak(text,after){
  if(!('speechSynthesis' in window)){after&&after();return}
  const clean=String(text).replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}]/gu,'').replace(/[*_#`~>]/g,'');
  const u=new SpeechSynthesisUtterance(clean);
  const lat=(clean.match(/[a-z]/gi)||[]).length>(clean.match(/[а-яёіїє]/gi)||[]).length;u.lang=lat?'en-US':'ru-RU';
  const vs=speechSynthesis.getVoices().filter(v=>(v.lang||'').toLowerCase().startsWith(u.lang.slice(0,2)));
  if(vs.length)u.voice=vs.find(v=>/yuri|юрий|dmitr|pavel|male/i.test(v.name))||vs[0];
  u.rate=1.04;u.pitch=.92;let done=false;

function singParse(txt){
  const out=[];let pend=null;
  String(txt).split('\n').map(s=>s.replace(/\s+$/,'')).forEach(l=>{

    if(!l.trim()){if(pend){out.push({ch:pend,tx:''});pend=null}return}
    out.push({ch:pend,tx:l.trim()});pend=null;
  });

}

  return`<div class="sing"><div class="sctl"><button class="gb" data-act="singprev" aria-label="Назад">${I('prev',18)}</button><button class="pri" data-act="singtog">${S2.run?I('pause',18):I('play',18)}</button><button class="gb" data-act="singrep">Повторить строку</button><button class="gb" data-act="singnext" aria-label="Дальше">${I('next',18)}</button>
    <select id="singRate" aria-label="Скорость">${[.5,.75,1].map(r=>`<option value="${r}"${S2.rate===r?' selected':''}>${r===1?'Обычная':r===.75?'Медленнее':'Медленно'}</option>`).join('')}</select><button class="gb" data-act="singedit">Изменить текст</button></div>
    <div id="singLines">${S2.lines.map((l,i)=>`<div class="sl${i===S2.i?' cur':''}" data-si="${i}">${l.ch?`<span class="chl">${esc(l.ch)}</span>`:''}${esc(l.tx)||'&nbsp;'}</div>`).join('')}</div></div>`;
}
function singRender(){const b=$('singBox');if(b)b.innerHTML=singHtml()}
function singMark(){const S2=AIX.sing;document.querySelectorAll('#singLines .sl').forEach((el,i)=>el.classList.toggle('cur',i===S2.i));const c=document.querySelector('#singLines .sl.cur');if(c)c.scrollIntoView({block:'center',behavior:'smooth'})}
function singTimer(){const S2=AIX.sing;clearTimeout(S2.t);if(!S2.run)return;const ms=60000/S2.bpm*S2.beats/S2.rate;
  S2.t=setTimeout(()=>{if(!AIX.sing||!S2.run)return;if(S2.i<S2.lines.length-1){S2.i++;singMark();singTimer()}else{S2.run=false;singRender()}},ms)}
function applyRate(r){try{au.playbackRate=r}catch(e){}try{if(mode==='yt'&&ytp)ytp.setPlaybackRate(r)}catch(e){}}

}
function anHtml(d){
  const sec=(h,v)=>v?`<h3>${h}</h3><p>${esc(v)}</p>`:'';
  return`<div class="card glass">${sec('О чём песня',d.summary)}${sec('Смысл',d.meaning)}${sec('Настроение',d.mood)}${sec('Инструменты и звучание',d.instruments)}${sec('Интересное',d.interesting)}
    ${Array.isArray(d.lines)&&d.lines.length?`<h3>Разбор строк</h3>${d.lines.slice(0,12).map(l=>`<p style="margin-bottom:8px"><b>${esc(l.line)}</b><br><span class="note">${esc(l.explain)}</span></p>`).join('')}`:''}
    ${d.translation?`<h3>Перевод фрагмента</h3><p style="white-space:pre-line">${esc(d.translation)}</p>`:''}
    ${Array.isArray(d.slang)&&d.slang.length?`<h3>Сленг и выражения</h3>${d.slang.slice(0,10).map(x=>`<p style="margin-bottom:6px"><b>${esc(x.phrase)}</b> — ${esc(x.explain)}</p>`).join('')}`:''}
    ${d.confidence?`<p class="note" style="margin-top:12px">${esc(d.confidence)}</p>`:''}
    <div class="row" style="margin-top:12px"><button class="gb" data-act="anplay">${I('play',16)} Слушать</button><button class="gb" data-act="anask">Обсудить в чате</button></div></div>`;
}

/* ---------- клики ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,i=+b.dataset.i,box=b.closest('[data-ctx]'),list=box?LISTS[box.dataset.ctx]||[]:[];
  const p=prof(),pl=SUB&&SUB.k==='pl'?getPl(SUB.arg):null;
  switch(a){
    case'tab':go(b.dataset.t);if(b.dataset.t==='search')setTimeout(()=>$('q').focus(),80);break;
    case'sub':openSub(b.dataset.k);break;
    case'back':back();break;
    case'q':$('q').value=b.dataset.q;search(b.dataset.q);break;
    case'artist':openArtist(artists[i]);break;
    case'fartist':{const x=p.artists[i];artists=[{id:x.id,name:x.name,picture_medium:x.picture,picture_big:x.picture,nb_fan:x.fans}];go('search');openArtist(artists[0]);break}
    case'follow':{if(!curArtist)break;const k=p.artists.findIndex(x=>x.id===curArtist.id);
      if(k>=0){p.artists.splice(k,1);toast('Отписка от '+curArtist.name)}else{p.artists.unshift({id:curArtist.id,name:curArtist.name,picture:curArtist.picture_medium||curArtist.picture,fans:curArtist.nb_fan||0});toast('Вы подписались на '+curArtist.name)}
      save();b.textContent=following(curArtist)?'Вы подписаны':'Подписаться';break}
    case'play':{const fc=b.closest('.fc');if(fc)fc.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});playFrom(list,i);break}
    case'playall':if(LISTS.search&&LISTS.search.length)playFrom(LISTS.search,0);break;
    case'playchart':if(chart&&chart.length)playFrom(LISTS.chart,0);else toast(netOk?'Чарт ещё грузится':'Музыкальные сервисы недоступны в этом окне');break;
    case'playfav':if(p.favorites.length)playFrom(p.favorites,0);else toast('В любимом пока пусто');break;
    case'fav':toggleFav(list[i]);break;
    case'favcur':if(queue[cur])toggleFav(queue[cur]);break;
    case'full':{const t=queue[cur];if(!t)break;if(t.id.startsWith('up:')){toast('Это твой файл, он играет целиком');break}
      const s=encodeURIComponent(t.artist+' '+t.name),ln=(h,n)=>`<a class="opt gb" style="color:var(--milk);text-decoration:none;min-height:48px" href="${h}" target="_blank" rel="noopener">${n}</a>`;
      sheet('Полная версия',ln('https://www.youtube.com/results?search_query='+s,'YouTube')+ln('https://open.spotify.com/search/'+s,'Spotify')+ln('https://music.apple.com/search?term='+s,'Apple Music')+ln(esc(t.link||'https://www.deezer.com/search/'+s),'Deezer'));break}
    case'add':pending=[list[i]];addSheet();break;
    /* AI Manager */
    case'aitab':AIX.tab=b.dataset.k;renderAITab();break;
    case'aiconsent':{const a=aiP(),v=b.dataset.v;a.consent={history:v==='all',prefs:v!=='none',asked:true};save();aiSave();renderAITab();break}
    case'aimoodbtn':AIX.moodOpen=!AIX.moodOpen;$('aiMood').hidden=!AIX.moodOpen;break;
    case'aimood':aiSend('Подбери музыку под моё настроение: '+b.dataset.q.toLowerCase()+'. Коротко объясни выбор.');break;
    case'aiq':aiSend(b.dataset.q);break;
    case'aiimg':$('fIm').click();break;
    case'aiimgx':AIX.img=null;renderPrev();break;
    case'aidict':listen();break;
    case'aivoice':voice.on=!voice.on;if(voice.on){try{speechSynthesis.speak(new SpeechSynthesisUtterance(' '))}catch(e){}listen()}else stopVoice();updVoiceBtn();break;
    case'pknow':if(queue[cur]){AIX.picked[b.dataset.k]=slim(queue[cur]);renderAITab()}break;
    case'pkpick':AIX.picked[b.dataset.k]=slim(LISTS.pk[i]);renderAITab();break;
    case'pkclear':AIX.picked[b.dataset.k]=null;renderAITab();break;
    case'analyze':{const t=AIX.picked.an;if(!t||AIX.anBusy)break;AIX.anText=$('anTxt').value;AIX.anBusy=true;renderAITab();
      const r=await aiCall({mode:'analyze',track:{artist:t.artist,title:t.name},text:AIX.anText,prefs:aiPrefs()});AIX.anBusy=false;
      if(r.error)toast(aiErr(r.error));else AIX.an={id:t.id,data:r.data||{}};if(TAB==='ai'&&AIX.tab==='an')renderAITab();break}
    case'anplay':if(AIX.picked.an){LISTS.anp=[AIX.picked.an];playFrom(LISTS.anp,0)}break;
    case'anask':{const t=AIX.picked.an;if(!t)break;AIX.tab='chat';renderAITab();aiSend('Расскажи подробнее про песню «'+t.name+'» — '+t.artist+'. Что в ней самое интересное?');break}
    case'linstr':AIX.instr=b.dataset.k;renderAITab();break;
    case'llevel':AIX.level=b.dataset.k;renderAITab();break;
    case'lmake':{const t=AIX.picked.pl;if(!t||AIX.lBusy)break;AIX.lBusy=true;renderAITab();
      const r=await aiCall({mode:'play',track:{artist:t.artist,title:t.name},instrument:instrName(AIX.instr),level:AIX.level,prefs:aiPrefs()});AIX.lBusy=false;
      if(r.error)toast(aiErr(r.error));else{AIX.lesson={track:t,instr:AIX.instr,level:AIX.level,data:r.data||{},saved:false};AIX.sing=null;if(aiP().consent.prefs)rememberPrefs({instruments:[instrName(AIX.instr).toLowerCase()]})}
      if(TAB==='ai'&&AIX.tab==='play')renderAITab();break}
    case'lplay':if(AIX.lesson){LISTS.lp=[AIX.lesson.track];playFrom(LISTS.lp,0)}break;
    case'lsave':{const a=aiP(),L=AIX.lesson;if(!L||L.saved)break;a.lessons.unshift({track:slim(L.track),instr:L.instr,level:L.level,data:L.data,at:Date.now()});a.lessons=a.lessons.slice(0,20);L.saved=true;save();toast('Урок сохранён');renderAITab();break}
    case'lopen':{const L=aiP().lessons[i];if(!L)break;AIX.lesson=Object.assign({},L,{saved:true});AIX.picked.pl=L.track;AIX.instr=L.instr;AIX.sing=null;renderAITab();window.scrollTo(0,0);break}
    case'ldel':{const a=aiP();a.lessons.splice(i,1);save();renderAITab();break}
    case'lsing':AIX.sing=AIX.sing||{};singRender();setTimeout(()=>{const s=$('singBox');if(s)s.scrollIntoView({behavior:'smooth',block:'start'})},50);break;
    case'singgo':{const L=AIX.lesson;if(!L)break;const txt=$('singTxt').value;AIX.singTxt=txt;
      let lines=txt.trim()?singParse(txt):(Array.isArray(L.data.sections)?L.data.sections:[]).map(x=>({ch:String(x.progression||''),tx:String(x.name||'')}));
      if(!lines.length){toast('Вставь текст или аккорды');break}
      AIX.sing={lines,i:0,run:true,bpm:Math.min(220,Math.max(40,+$('singBpm').value||90)),beats:8,rate:1,t:0};applyRate(1);singRender();singTimer();break}
    case'singtog':{const s=AIX.sing;if(!s||!s.lines)break;s.run=!s.run;singRender();singTimer();break}
    case'singprev':case'singnext':{const s=AIX.sing;if(!s||!s.lines)break;s.i=Math.max(0,Math.min(s.lines.length-1,s.i+(a==='singnext'?1:-1)));singMark();singTimer();break}
    case'singrep':{const s=AIX.sing;if(!s||!s.lines)break;s.run=true;singRender();singTimer();break}
    case'singedit':{if(AIX.sing)clearTimeout(AIX.sing.t);AIX.sing={};singRender();const ta=$('singTxt');if(ta)ta.value=AIX.singTxt||'';break}
    case'prefdel':{const a=aiP(),k=b.dataset.k;if(k==='level')a.prefs.level='';else a.prefs[k].splice(i,1);save();renderAITab();break}
    case'prefclear':{const a=aiP();a.prefs={genres:[],artists:[],songs:[],moods:[],instruments:[],level:''};save();toast('Предпочтения удалены');renderAITab();break}
    case'aiclear':aiMsgs=[];AIX.typing=null;aiSave();toast('Переписка очищена');renderAITab();break;
    case'addall':pending=(LISTS.search||[]).slice();addSheet();break;
    case'addto':addTo(getPl(b.dataset.id));break;
    case'newpl-add':addTo(newPl($('npName').value.trim()));break;
    case'rm':if(pl){pl.tracks.splice(i,1);save();renderSub()}break;
    case'newpl':sheet('Новый плейлист',`<input id="npName2" maxlength="40" placeholder="Название"><button class="pri" style="width:100%;margin-top:10px" data-act="newpl-save">Создать</button>`);break;
    case'newpl-save':{const x=newPl($('npName2').value.trim());closeSheet();openSub('pl',x.id);break}
    case'openpl':openSub('pl',b.dataset.id);break;
    case'plplayid':{const x=getPl(b.dataset.id);if(x&&x.tracks.length)playFrom(x.tracks,0);else toast('Плейлист пуст');break}
    case'plmenu':sheet('Плейлист',`<button class="opt" data-act="openpl" data-id="${b.dataset.id}">${I('list',18)}Открыть</button><button class="opt" data-act="plrename" data-id="${b.dataset.id}">${I('edit',18)}Переименовать</button><button class="opt" style="color:#ff6b6b" data-act="pldel" data-id="${b.dataset.id}">${I('trash',18)}Удалить</button>`);break;
    case'plplay':if(pl&&pl.tracks.length)playFrom(pl.tracks,0);break;
    case'vibeadd':{const t=list[i];if(!pl||!t)break;if(!pl.tracks.some(x=>x.id===t.id))pl.tracks.push(slim(t));save();toast('Добавлено в «'+pl.name+'»');if(VIBE[pl.id]&&VIBE[pl.id].list.length<=1)delete VIBE[pl.id];renderSub();break}
    case'vibeall':{if(!pl)break;const ids=new Set(pl.tracks.map(x=>x.id));let n=0;(LISTS.vibe||[]).forEach(t=>{if(!ids.has(t.id)){pl.tracks.push(slim(t));n++}});save();toast('Добавлено: '+n);delete VIBE[pl.id];renderSub();break}
    case'vibemore':if(pl){delete VIBE[pl.id];renderVibe(pl,true)}break;
    case'plshuffle':if(pl&&pl.tracks.length)playFrom(pl.tracks.slice().sort(()=>Math.random()-.5),0);break;
    case'plrename':{const x=b.dataset.id?getPl(b.dataset.id):pl;if(!x)break;sheet('Переименовать',`<input id="rn" maxlength="40" value="${esc(x.name)}"><button class="pri" style="width:100%;margin-top:10px" data-act="plrename-save" data-id="${x.id}">Сохранить</button>`);break}
    case'plrename-save':{const x=getPl(b.dataset.id);if(x){x.name=$('rn').value.trim()||x.name;save()}closeSheet();rerender();break}
    case'pldel':{const x=b.dataset.id?getPl(b.dataset.id):pl;if(!x)break;sheet('Удалить «'+x.name+'»?',`<button class="opt" style="color:#ff6b6b" data-act="pldel-yes" data-id="${x.id}">Да, удалить</button><button class="opt" data-act="close">Отмена</button>`);break}
    case'pldel-yes':{const x=getPl(b.dataset.id);p.playlists=p.playlists.filter(y=>y.id!==b.dataset.id);save();closeSheet();if(x)notify('Удалён плейлист «'+x.name+'»');if(SUB&&SUB.k==='pl')back();else rerender();break}
    case'favtopl':{const x=newPl('Любимое '+new Date().toLocaleDateString('ru'));x.tracks=p.favorites.map(slim);save();openSub('pl',x.id);break}
    case'close':closeSheet();break;
    case'ytkey':{const k=$('ytKeyIn').value.trim();if(k&&!/^AIza[0-9A-Za-z_\-]{30,}$/.test(k)){toast('Ключ должен начинаться с AIza…');break}S.ytKey=k;S.yt={};save();toast(k?'Ключ сохранён: песни будут играть целиком':'Ключ удалён');renderSub();break}
    case'clearhist':p.history=[];save();toast('История очищена');rerender();break;
    case'clearnotifs':p.notifs=[];save();renderSub();updBell();break;
    case'pickup':$('fUp').click();break;
    case'rmup':{const t=list[i];if(!t)break;const id=t.id.slice(3);await setBlob(t.id,null).catch(()=>{});p.uploads=p.uploads.filter(u=>u.id!==id);
      p.favorites=p.favorites.filter(x=>x.id!==t.id);p.playlists.forEach(x=>x.tracks=x.tracks.filter(y=>y.id!==t.id));save();toast('Файл удалён');renderSub();break}
    case'shareprof':shareProfile();break;
    case'savesh':{const x=SUB&&SUB.arg&&SUB.arg.pl[i];if(!x)break;const n=newPl(x.n+' · @'+SUB.arg.u);n.tracks=LISTS['shp'+i].map(slim);save();toast('Плейлист сохранён в библиотеку');break}
    case'supcopy':copy(`${APP} ${VER} — обращение\n\n${$('supTxt').value.trim()||'(без описания)'}\n\n— диагностика —\nБраузер: ${navigator.userAgent}\nДоступ к сервисам: ${netOk?'есть':'нет'}\nАдрес: ${location.protocol}//${location.host}\nПрофилей: ${S.profiles.length}\nВремя: ${new Date().toLocaleString('ru')}`,'Обращение скопировано');break;
    /* редактирование */
    case'pickav':$('fAv').click();break;
    case'pickbn':$('fBn').click();break;
    case'rmav':keepDraft();draft.av=null;renderSub();break;
    case'rmbn':keepDraft();draft.bn=null;renderSub();break;
    case'reposav':case'reposbn':{const kind=a==='reposav'?'av':'bn';keepDraft();
      const blob=draft[kind]?draft[kind].blob:await idb.get(kind+':'+p.id).catch(()=>null);
      if(!blob){toast('Файл не найден, загрузи заново');break}
      const r=await crop(blob,kind==='av'?1:16/9);if(r&&draft){draft[kind]=r;renderSub()}break}
    case'editcancel':back();break;
    case'editsave':{
      draft.name=$('eName').value.trim();draft.username=$('eUser').value.trim().toLowerCase();draft.bio=$('eBio').value.trim();
      if(!draft.name)return toast('Имя не может быть пустым');
      if(!checkUser())return toast('Проверь username');
      try{
        for(const kind of['av','bn']){
          const d=draft[kind],flag=kind==='av'?'hasAv':'hasBn';
          if(d){await setBlob(kind+':'+p.id,d.blob);p[flag]=true;p[kind+'Pos']=d.pos;p[kind+'Type']=d.type}
          else if(d===null){await setBlob(kind+':'+p.id,null);p[flag]=false;delete p[kind+'Pos'];delete p[kind+'Type']}
        }
      }catch(err){return toast('Не удалось сохранить фото: мало памяти на устройстве')}
      p.name=draft.name;p.username=draft.username;p.bio=draft.bio;save();notify('Профиль обновлён');toast('Сохранено');SUB=null;draft=null;go('profile');break}
    /* аккаунт */
    case'login':login(b.dataset.id);break;
    case'signup':signup();break;
    case'logout':sheet('Выйти из аккаунта?',`<p class="note" style="margin-top:0">Данные останутся на устройстве, войти можно в любой момент.</p><button class="opt" data-act="logout-yes">${I('out',18)}Выйти</button><button class="opt" data-act="close">Отмена</button>`);break;
    case'logout-yes':closeSheet();logout();break;
    case'pexport':{const x={...p};delete x.history;sheet('Экспорт профиля',`<textarea id="ex" readonly>${esc(JSON.stringify(x))}</textarea><button class="pri" style="width:100%;margin-top:10px" data-act="excopy">Скопировать</button><p class="note">Фото и загруженные файлы не переносятся.</p>`);break}
    case'excopy':copy($('ex').value);break;
    case'pimport':sheet('Импорт профиля',`<textarea id="im" placeholder="Вставь текст экспорта"></textarea><button class="pri" style="width:100%;margin-top:10px" data-act="pimport-save">Импортировать</button>`);break;
    case'pimport-save':try{const x=migrate(JSON.parse($('im').value));if(!Array.isArray(x.playlists)||!x.name)throw 0;x.id=uid();x.hasAv=x.hasBn=false;x.uploads=[];x.username=uniqUser(x.username||slug(x.name),x.id);S.profiles.push(x);save();closeSheet();login(x.id);toast('Аккаунт «'+x.name+'» добавлен')}catch(err){toast('Не похоже на экспорт '+APP)}break;
    case'pdel':sheet('Удалить аккаунт «'+p.name+'»?',`<p class="note" style="margin-top:0">Удалятся плейлисты, история, фото и загрузки этого аккаунта.</p><button class="opt" style="color:#ff6b6b" data-act="pdel-yes">Да, удалить навсегда</button><button class="opt" data-act="close">Отмена</button>`);break;
    case'pdel-yes':{const keys=['av:'+p.id,'bn:'+p.id,...p.uploads.map(u=>'up:'+u.id)];await Promise.all(keys.map(k=>setBlob(k,null).catch(()=>{})));
      S.profiles=S.profiles.filter(x=>x.id!==p.id);closeSheet();logout();break}
  }
});
document.addEventListener('input',e=>{
  if(!draft)return;
  if(e.target.id==='eUser'){draft.username=e.target.value.trim().toLowerCase().replace(/^@/,'');checkUser()}
  if(e.target.id==='eName'){draft.name=e.target.value;const s=$('eAv')&&$('eAv').querySelector('span');if(s)s.textContent=(draft.name[0]||'?').toUpperCase()}
  if(e.target.id==='eBio'){draft.bio=e.target.value;$('bioN').textContent=e.target.value.length+'/160'}
});
document.addEventListener('change',async e=>{
  const id=e.target.id,p=prof();
  if(id==='fAv'||id==='fBn'){
    const f=e.target.files[0];e.target.value='';if(!draft)return;
    keepDraft();
    const r=await crop(f,id==='fAv'?1:16/9);
    if(r&&draft){draft[id==='fAv'?'av':'bn']=r;renderSub()}
  }
  if(id==='fUp'){
    const files=[...e.target.files];e.target.value='';let n=0;
    for(const f of files){
      if(!/^audio\//.test(f.type)&&!/\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(f.name)){toast(f.name+': это не аудио');continue}
      if(f.size>50*1048576){toast(f.name+': больше 50 МБ');continue}
      const uidv=uid();
      try{await idb.set('up:'+uidv,f)}catch(err){toast('Не хватает памяти для '+f.name);continue}
      p.uploads.unshift({id:uidv,name:f.name.replace(/\.[^.]+$/,''),size:f.size,at:Date.now()});n++;
    }
    if(n){save();notify('Загружено: '+plural(n,'трек','трека','треков'));toast('Загружено: '+n)}
    if(SUB&&SUB.k==='up')renderSub();
  }
  if(id==='sAuto'){p.settings.autoplay=e.target.checked;save()}
  if(id==='cPrefs'){const a=aiP();a.consent.prefs=e.target.checked;a.consent.asked=true;save()}
  if(id==='cHist'){const a=aiP();a.consent.history=e.target.checked;a.consent.asked=true;aiSave()}
  if(id==='singRate'&&AIX.sing){AIX.sing.rate=+e.target.value;applyRate(AIX.sing.rate);singTimer()}
  if(id==='fIm'){const f=e.target.files[0];e.target.value='';const r=await shrinkImage(f);if(r){AIX.img=r;renderPrev()}}
  if(id==='sFull'){p.settings.full=e.target.checked;save();if(!e.target.checked&&mode==='yt'){const t=queue[cur];ytStop();if(t)ytFallback(t)}}
  if(id==='sReduce'){p.settings.reduce=e.target.checked;save();applySettings()}
});
$('f').onsubmit=e=>{e.preventDefault();$('q').blur();search($('q').value)};
document.addEventListener('submit',e=>{
  if(e.target.id==='aiForm'){e.preventDefault();const ta=$('aiTxt');const v=ta.value;ta.value='';ta.style.height='';aiSend(v)}
  else if(e.target.classList.contains('pkf')){e.preventDefault();pickSearch(e.target.dataset.k,e.target.querySelector('input').value)}
});
document.addEventListener('keydown',e=>{if(e.target.id==='aiTxt'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('aiForm').requestSubmit()}});
document.addEventListener('input',e=>{if(e.target.id==='aiTxt'){e.target.style.height='';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px'}});
try{new ResizeObserver(()=>{const m=$('mini');document.documentElement.style.setProperty('--minih',(m.offsetHeight?m.offsetHeight+8:0)+'px')}).observe($('mini'))}catch(e){}
window.addEventListener('resize',()=>requestAnimationFrame(flowFx));

/* ---------- старт ---------- */
S.profiles.forEach(migrate);save();
loadChart();
if(prof())login(S.active);else renderLogin();
}
</script>
</body>
</html>
